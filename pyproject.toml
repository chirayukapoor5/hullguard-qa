[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hullguard-qa"
version = "1.0.0"
description = "Regression and artifact consistency checks for synthetic ship structures"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-cov==7.1.0", "ruff==0.15.21"]

[project.scripts]
hullguard = "hullguard.cli:main"

[tool.setuptools.packages.find]
include = ["hullguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fault: controlled negative scenario with an expected detector"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["hullguard"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
